
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teachers' Day</title>

  <style>
    * {
      margin: 0;
      padding: 0;

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;

      background: linear-gradient(135deg, #fff8e7, #f7e6c4);
      font-family: Arial, sans-serif;
     body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fff8e7, #f7e6c4);
  font-family: Arial, sans-serif;
}

.card {
  width: 390px;
  height: 820px;
  padding: 75px 35px 40px;
  text-align: center;

  background: #fffdf8;
  border: 6px solid #1c1c1c;
  border-radius: 48px;

  box-shadow:
    0 20px 50px rgba(0,0,0,0.25),

      .card {
  width: 390px;
  height: 820px;
  padding: 75px 35px 40px;
  text-align: center;

  background: #fffdf8;
  border: 6px solid #1c1c1c;
  border-radius: 48px;

  box-shadow:
    0 20px 50px rgba(0,0,0,0.25),
    inset 0 0 0 2px #d4af37;

  position: relative;
  overflow: hidden;
} overflow: hidden;
    }

    .card::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);

  width: 110px;
  height: 28px;

  background: #111;
  border-radius: 20px;
  z-index: 10;
}

    .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      color: #222;
      margin-bottom: 10px;
    }

    h1 span {
      color: #d4af37;
    }

    h2 {
      font-size: 28px;
      color: #333;
      margin-bottom: 25px;
    }

    p {
      color: #666;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 25px;
      background: #d4af37;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    #message {
      display: none;
      margin-top: 25px;
      color: #8a6d1d;
      font-weight: bold;
    }

    .heart {
      position: absolute;
      font-size: 25px;
      animation: float 4s linear infinite;
    }
.flower {
  position: absolute;
  font-size: 25px;
  animation: flowerFloat 5s linear infinite;
  pointer-events: none;
}

.sparkle {
  position: absolute;
  font-size: 18px;
  animation: sparkle 2s ease-in-out infinite;
  pointer-events: none;
}

@keyframes flowerFloat {
  0% {
    transform: translateY(100vh) rotate(0deg);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translateY(-10vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes sparkle {
  0%, 100% {
    transform: scale(0.5);
    opacity: 0.3;
  }

  50% {
    transform: scale(1.3);
    opacity: 1;
  }
}
    @keyframes float {
      0% {
        transform: translateY(100vh);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }@keyframes popIn {
  0% {
    transform: scale(0.5);
    opacity: 0;
  }

  60% {
    transform: scale(1.15);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}----
.sparkle {
  position: fixed;
  font-size: 22px;
  pointer-events: none;
  animation: sparkleBurst 2s ease-out forwards;
  z-index: 999;
}

@keyframes sparkleBurst {
  0% {
    transform: scale(0.3);
    opacity: 0;
  }

  30% {
    opacity: 1;
    transform: scale(1.3);
  }

  100% {
    transform: translateY(-120px) scale(0.5);
    opacity: 0;
  }
}@media (max-width: 600px) {
  .card {
    width: 92vw;
    height: 88vh;
    padding: 65px 22px 30px;
    border-radius: 38px;
  }

  h1 {
    font-size: 32px;
  }

  h2 {
    font-size: 22px;
  }

  p {
    font-size: 15px;
  }

  button {
    font-size: 15px;
    padding: 12px 22px;
  }
}
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🌸</div>

    <h1>Happy <span>Teachers’ Day</span></h1>

    <h2>Kavya Mam ❤️</h2>

    <p>
      Thank you for inspiring us, guiding us,
      and always encouraging us to do our best.
      Your teaching makes a difference in our lives.
    </p>

    <button onclick="showMessage()">
      Click for a Surprise ✨
    </button>

    <div id="message">
      🌷 Thank you for being an amazing teacher! 🌷
    </div>

  </div>

  <script>
    function showMessage() {
  document.getElementById("message").style.display = "block";

  // Sparkles
  for (let i = 0; i < 20; i++) {
    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.innerHTML = "✨";

    sparkle.style.left = (40 + Math.random() * 20) + "vw";
    sparkle.style.top = (40 + Math.random() * 20) + "vh";

    document.body.appendChild(sparkle);

    setTimeout(() => {
      sparkle.remove();
    }, 2000);
  }
}

 //💛 Floating hearts

// 💛 Floating hearts

setInterval(() => {
  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerHTML = "💛";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration =
    (3 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);

}, 700);



  </script>

</body>
</html>
